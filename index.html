function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 2200); }
function copyText(text, okMsg) {

  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(okMsg), fallback); else fallback();

/* ============================== 채점 ============================== */
const norm = t => t.toLowerCase().replace(/[~\s.·…]/g, '');
function gradeAnswer(user, ko) {
  const u = norm(String(user).replace(/[()\[\]<>]/g, ''));
  if (!u) return false;
  const cands = new Set();
  String(ko).split(/[,;]+/).forEach(p => {
    const a = norm(p.replace(/\([^)]*\)|\[[^\]]*\]|<[^>]*>/g, ''));           // 괄호 속 보충 설명 제외
    const b = norm(p.replace(/[()\[\]<>]/g, ''));                              // 괄호만 제거
    const c = norm(p.replace(/\([^)]*\)|<[^>]*>/g, '').replace(/(\S+)\[([^\]]+)\]/g, (m, pre, alt) => pre.slice(0, Math.max(0, pre.length - alt.length)) + alt)); // 발달[발전]하다 → 발전하다
    [a, b, c].forEach(x => { if (x) cands.add(x); });
  });
  for (const m of cands) {
    if (u === m || u.includes(m)) return true;
    if (u.length >= 2 && m.includes(u)) return true;
  }
  return false;
}

/* ====================== 단어 붙여넣기 인식 ====================== */
function parseWords(text) {
  const out = [];
  String(text).split(/\r?\n/).forEach(line => {
    line = line.trim(); if (!line) return;
    let en, ko;
    if (line.includes('\t')) { const i = line.indexOf('\t'); en = line.slice(0, i); ko = line.slice(i + 1).replace(/\t+/g, ' '); }
    else { const m = line.match(/[가-힣ㄱ-ㅎ]/); if (!m) return; let i = m.index; while (i > 0 && /[~(\[<\s]/.test(line[i - 1])) i--; en = line.slice(0, i); ko = line.slice(i); }
    en = en.trim().replace(/[\s:=|]+$/, '').replace(/\s[-–]$/, '').trim(); ko = ko.trim();
    if (en && ko) out.push({ en, ko });
  });
  return out;
}

/* ============================== 저장소 ============================== */
const USE_FB = !!(CONFIG.FIREBASE && CONFIG.FIREBASE.apiKey && CONFIG.FIREBASE.databaseURL);
let storeError = '';
function localStore() {
  const KEY = 'vocaHubLocalDB', subs = {}; let mem = {};
  const load = () => { mem = lsGet(KEY, mem) || {}; };
  const emit = top => (subs[top] || []).forEach(cb => cb(Object.assign({}, mem[top] || {})));
  window.addEventListener('storage', e => { if (e.key === KEY) { load(); Object.keys(subs).forEach(emit); } });
  load();
  return {
    sub(top, cb) { (subs[top] = subs[top] || []).push(cb); setTimeout(() => cb(Object.assign({}, mem[top] || {})), 0); },
    set(top, id, val) { load(); (mem[top] = mem[top] || {})[id] = val; lsSet(KEY, mem); emit(top); return Promise.resolve(); },
    remove(top, id) { load(); if (mem[top]) delete mem[top][id]; lsSet(KEY, mem); emit(top); return Promise.resolve(); }
  };
}
function fbStore() {
  firebase.initializeApp(CONFIG.FIREBASE);
  const db = firebase.database();
  return {
    sub(top, cb) { db.ref(top).on('value', s => cb(s.val() || {}), e => { storeError = '저장소를 읽지 못했습니다. Firebase 규칙(읽기/쓰기 허용)을 확인해 주세요.'; render(); }); },
    set: (top, id, val) => db.ref(top + '/' + id).set(val),
    remove: (top, id) => db.ref(top + '/' + id).remove()
  };
}
let store;
try {
  if (USE_FB) { if (typeof firebase === 'undefined') throw new Error('nofb'); store = fbStore(); }
  else store = localStore();
} catch (e) {
  storeError = 'Firebase에 연결하지 못했습니다. 인터넷 연결과 CONFIG 값을 확인해 주세요. (지금은 이 기기에만 저장됩니다)';
  store = localStore();
}

  const p = lsGet(PENDING, {});
  Object.keys(p).forEach(id => {
    Promise.resolve().then(() => store.set('records', id, p[id])).then(() => { const q = lsGet(PENDING, {}); delete q[id]; lsSet(PENDING, q); }).catch(() => {});
  });
}

/* ---------- 학생: 범위 설정 ---------- */
function setupPool(t) { let n = 0; t.groups.forEach((g, i) => { if (S.selGroups.includes(i)) n += g.words.length; }); return n; }
function vSetup() {
  const t = getTest(S.testId);
  if (!t || t.hidden) { S.view = 'home'; return vHome(); }
  const multi = t.groups.length > 1, pool = setupPool(t);
  const opts = ['ALL', 150, 100, 50, 30, 20, 10].filter(c => c === 'ALL' || c < pool);
  if (!opts.includes(S.count)) S.count = 'ALL';
  const n = S.count === 'ALL' ? pool : S.count, lim = limitSeconds(t, n);
  return `<div class="min-h-screen flex items-center justify-center p-6"><div class="bg-white p-8 rounded-[2rem] shadow-2xl max-w-lg w-full border border-gray-100">

        </div></div>` : ''}

    </div>
    <button data-act="startQuiz" ${pool ? '' : 'disabled'} class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-200 disabled:shadow-none text-white font-bold py-5 rounded-2xl transition-all shadow-xl shadow-blue-200 active:scale-[0.98]">주관식 뜻 쓰기 시작</button>
  </div></div>`;
}

/* ---------- 학생: 시험 ---------- */
function startQuiz() {
  const t = getTest(S.testId); if (!t) return;
  let pool = [];
  const sel = S.selGroups.slice().sort((a, b) => a - b);
  sel.forEach(i => { if (t.groups[i]) pool = pool.concat(t.groups[i].words); });
  if (!pool.length) return;
  if (t.order !== 'seq') pool = shuffle(pool);
  const n = S.count === 'ALL' ? pool.length : Math.min(Number(S.count), pool.length);
  const range = t.groups.length <= 1 ? '전체' : sel.length === t.groups.length ? '전체 범위' : sel.length <= 4 ? sel.map(i => t.groups[i].name).join(', ') : t.groups[sel[0]].name + ' 외 ' + (sel.length - 1) + '개';
  Q = { id: uid(), test: t, range, qs: pool.slice(0, n), idx: 0, score: 0, wrong: [], startMs: Date.now(), limitSec: limitSeconds(t, n), locked: false, done: false, status: '', elapsed: 0 };
  S.view = 'quiz';
  drawQuestion();
  Q.timer = setInterval(tick, 250); tick();
}
const elapsedNow = () => (Date.now() - Q.startMs) / 1000;
function tick() {
  if (!Q || Q.done) return;
  const el = elapsedNow(), node = $('#timer');
  if (Q.limitSec) {
    const left = Q.limitSec - el;
    if (node) { node.textContent = '⏱ ' + fmt(Math.ceil(left)); node.className = 'px-4 py-1.5 rounded-full text-xs font-bold tnum ' + (left <= 30 ? 'bg-red-50 text-red-600' : 'bg-amber-50 text-amber-700'); }
    if (left <= 0) finishQuiz('timeout');
  } else if (node) node.textContent = '⏱ ' + fmt(el);
}
function drawQuestion() {
  const cur = Q.qs[Q.idx], progress = Q.idx / Q.qs.length * 100;
  app.innerHTML = `<div class="min-h-screen flex items-center justify-center p-4"><div class="bg-white p-8 rounded-[2.5rem] shadow-2xl max-w-lg w-full relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-2 bg-gray-100"><div class="h-full bg-blue-600 transition-all duration-500" style="width:${progress}%"></div></div>
    <div class="flex justify-between items-center mb-10 pt-4 gap-2">
      <div class="px-4 py-1.5 bg-gray-100 rounded-full text-xs font-bold text-gray-500">Q. ${Q.idx + 1} / ${Q.qs.length}</div>
      <div id="timer" class="px-4 py-1.5 bg-gray-100 rounded-full text-xs font-bold text-gray-500 tnum"></div>
      <div class="px-4 py-1.5 bg-green-50 rounded-full text-xs font-bold text-green-600">SCORE: ${Q.score}</div>
    </div>
    <div class="text-center mb-10">
      <p class="text-xs font-bold text-blue-500 mb-4 tracking-widest uppercase">뜻을 입력하세요</p>
      <h2 class="${cur[0].length > 14 ? 'text-3xl' : 'text-5xl'} font-black text-gray-900 tracking-tighter break-words">${esc(cur[0])}</h2>
    </div>
    <form data-form="answer" class="space-y-4">
      <input id="ans" type="text" placeholder="..." autocomplete="off" class="w-full p-5 border-2 rounded-3xl text-center text-xl font-bold outline-none transition-all border-gray-100 focus:border-blue-500 bg-gray-50">
      <button type="submit" id="ansBtn" class="w-full bg-gray-900 text-white font-bold py-5 rounded-3xl transition-all active:scale-[0.99] shadow-lg">확인</button>
    </form>
    <div id="fb" class="h-16 mt-6 flex items-center justify-center"></div>
    <div class="flex justify-between items-center text-xs font-bold text-gray-300"><span>Enter 키로 제출</span><button data-act="quitQuiz" class="hover:text-gray-500">그만하기</button></div>
  </div></div>`;
  tick();
  const a = $('#ans'); if (a) a.focus();
}
function submitAnswer() {
  if (!Q || Q.done || Q.locked) return;
  const input = $('#ans'), val = input.value.trim(); if (!val) return;
  Q.locked = true;
  const cur = Q.qs[Q.idx], ok = gradeAnswer(val, cur[1]);
  if (ok) Q.score++; else Q.wrong.push({ q: cur[0], u: val, c: cur[1] });
  Q.idx++;
  input.disabled = true; $('#ansBtn').disabled = true;
  input.className = 'w-full p-5 border-2 rounded-3xl text-center text-xl font-bold outline-none transition-all ' + (ok ? 'border-green-500 bg-green-50 text-green-700' : 'border-red-500 bg-red-50 text-red-700');
  $('#fb').innerHTML = ok ? '<div class="text-center font-bold text-lg animate-bounce"><span class="text-green-600">✨ 정답입니다!</span></div>'
    : `<div class="text-center font-bold text-lg flex flex-col"><span class="text-xs text-gray-400 mb-1">정답:</span><span class="text-blue-600 break-words">${esc(cur[1])}</span></div>`;
  const last = Q.idx >= Q.qs.length;
  if (last) Q.elapsedAtLast = elapsedNow();
  Q.next = setTimeout(() => { if (!Q || Q.done) return; Q.locked = false; if (last) finishQuiz('done'); else drawQuestion(); }, ok ? 1000 : 1500);
}
function buildRecord(status) {
  let el = Q.elapsedAtLast != null ? Q.elapsedAtLast : elapsedNow();
  if (Q.limitSec) el = Math.min(el, Q.limitSec);
  return {
    code: S.student.code, name: studentName(S.student.code), testId: Q.test.id, testTitle: Q.test.title, range: Q.range,
    total: Q.qs.length, answered: Q.idx, score: Q.score, elapsedSec: Math.round(el), limitSec: Q.limitSec || 0,
    status, startedAt: Q.startMs, finishedAt: Date.now(), wrong: Q.wrong

}
function finishQuiz(status) {
  if (!Q || Q.done) return;
  Q.done = true; clearInterval(Q.timer); clearTimeout(Q.next);
  Q.rec = buildRecord(status);
  queueRecord(Q.id, Q.rec);
  S.view = 'result'; render();
}
// 시험 도중 창을 닫으면 '중단' 기록으로 남김
window.addEventListener('pagehide', () => { if (Q && !Q.done) { Q.done = true; queueRecord(Q.id, buildRecord('quit')); } });

/* ---------- 학생: 결과 ---------- */
const STATUS = { done: ['완료', 'bg-green-50 text-green-600'], timeout: ['시간 초과', 'bg-amber-50 text-amber-700'], quit: ['중단', 'bg-gray-100 text-gray-500'] };

}

      <div class="max-h-64 overflow-y-auto space-y-3 pr-2">${wrongListHtml(r)}</div>

function wrongText(r) {

    (r.wrong || []).map((x, i) => `${i + 1}. ${x.q} → 내 답변: ${x.u || '없음'} (정답: ${x.c})`).join('\n');
}

/* ---------- 학부모 ---------- */
function parentRecords() {
  return Object.values(S.records).filter(r => r && r.total && r.code === S.parent.code).sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));
}
function vParent() {
  const mine = parentRecords(), cnt = {}, titles = {};
  mine.forEach(r => { cnt[r.testId] = (cnt[r.testId] || 0) + 1; titles[r.testId] = r.testTitle || '단어장'; });

  const stat = (l, v, c) => `<div class="${c} rounded-3xl p-4 text-center"><div class="text-[10px] font-bold uppercase mb-1 opacity-70">${l}</div><div class="text-2xl font-black tnum">${v}</div></div>`;
  const chip = (id, label, n) => `<button data-act="parTest" data-id="${esc(id)}" class="px-4 py-2 rounded-full text-xs font-bold border-2 transition-all ${(S.parTest || '') === id ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white border-gray-100 text-gray-500 hover:border-blue-300'}">${esc(label)} <span class="opacity-70">${n}</span></button>`;
  const who = esc(studentName(S.parent.code));
  return `<div class="min-h-screen p-4 sm:p-6"><div class="max-w-2xl mx-auto">

    : `<div class="grid grid-cols-3 gap-3 mb-5">${stat('응시 횟수', rows.length + '회', 'bg-blue-50 text-blue-700')}${stat('평균 정답률', avg + '%', 'bg-indigo-50 text-indigo-700')}${stat('평균 소요시간', fmt(avgT), 'bg-amber-50 text-amber-700')}</div>

    case 'selNone': S.selGroups = []; render(); break;
    case 'startQuiz': startQuiz(); break;
    case 'quitQuiz': if (Q && !Q.done && confirm('시험을 그만할까요? 여기까지의 결과가 기록됩니다.')) finishQuiz('quit'); break;
    case 'copyWrong': copyText(wrongText(Q.rec), '오답 노트가 복사되었습니다!'); break;
    case 'tTab': S.tTab = b.dataset.v; S.editId = null; render(); break;
    case 'parTest': S.parTest = id || null; render(); break;
    case 'recTest': S.recTest = id || null; drawRecords(); break;
    case 'detail': S.detailId = id; drawDetail(); break;
    case 'copyDetail': if (S.records[S.detailId]) copyText(wrongText(S.records[S.detailId]), '오답 노트가 복사되었습니다!'); break;
    case 'delRecord': if (confirm('이 응시 기록을 삭제할까요?')) Promise.resolve(store.remove('records', id)).catch(() => toast('삭제에 실패했습니다')); break;
    case 'copyRecords': {
      const rows = filteredRecords();
      copyText(['이름\t학생코드\t단어장\t범위\t푼 문제\t전체 문제\t점수\t정답률(%)\t소요시간\t상태\t응시 일시'].concat(rows.map(r =>
        [r.name, r.group || '', r.testTitle || '', r.range || '', r.answered || 0, r.total, r.score, Math.round(r.score / r.total * 100), fmt(r.elapsedSec), (STATUS[r.status] || STATUS.done)[0], fmtDate(r.finishedAt || r.startedAt)].join('\t'))).join('\n'), rows.length + '건이 복사되었습니다');
      break; }
    case 'delStudent': if (confirm('학생코드 ' + id + '을(를) 삭제할까요? (응시 기록은 남습니다)')) Promise.resolve(store.remove('students', id)).catch(() => toast('삭제에 실패했습니다')); break;
    case 'editTest': S.editId = id; drawTestForm(); $('#testForm').scrollIntoView({ behavior: 'smooth' }); break;
    case 'cancelEdit': S.editId = null; drawTestForm(); break;
    case 'delTest': if (confirm('이 단어장을 삭제할까요? (이미 쌓인 응시 기록은 남습니다)')) { if (S.editId === id) S.editId = null; Promise.resolve(store.remove('customTests', id)).then(() => { store.remove('settings', id); toast('삭제되었습니다'); drawTestForm(); }, () => toast('삭제에 실패했습니다')); } break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.change === 'count') { S.count = el.value === 'ALL' ? 'ALL' : Number(el.value); render(); }
  else if (el.dataset.set) {
    const id = el.dataset.id, k = el.dataset.set;
    if (k === 'limitMode') saveSetting(id, { limitMode: el.value });
    else if (k === 'limitVal') saveSetting(id, { limitVal: Math.max(0, Number(el.value) || 0) });
    else if (k === 'order') saveSetting(id, { order: el.value });
    else if (k === 'visible') saveSetting(id, { hidden: !el.checked });
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'recSearch') { S.recSearch = e.target.value; drawRecords(); }
  else if (e.target.closest && e.target.closest('#testForm') && e.target.tagName === 'TEXTAREA') updatePreview();
});

/* ============================== 시작 ============================== */
function onData() {
  if (S.view === 'home' || S.view === 'setup') render();
  else if (S.view === 'teacher') { if (S.tTab === 'manage') drawTestList(); else if (S.tTab === 'students') drawStudents(); else drawRecords(); }
  else if (S.view === 'parent') render();
}
store.sub('customTests', v => { S.custom = v; S.loaded.custom = true; onData(); });
store.sub('students', v => { S.students = v; S.loaded.students = true; onData(); });
store.sub('settings', v => { S.settings = v; S.loaded.settings = true; onData(); });
flushPending();
window.addEventListener('online', flushPending);
let wasTeacher = false; try { wasTeacher = sessionStorage.getItem('vocaHubTeacher') === '1'; } catch (e) {}
if (wasTeacher) goTeacher(); else render();
</script>
</body>
</html>
